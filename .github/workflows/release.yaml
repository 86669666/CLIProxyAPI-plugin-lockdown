name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GO_VERSION: '1.26.6'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify immutable release target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Run tests
        run: go test ./...
      - name: Build Linux release archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist

          for arch in amd64 arm64; do
            asset_arch="$arch"
            if [[ "$arch" == arm64 ]]; then
              asset_arch=aarch64
            fi

            archive_dir="dist/linux-${arch}/archive"
            archive_name="CLIProxyAPI_${version}_linux_${asset_arch}_no-plugin.tar.gz"
            rm -rf "dist/linux-${arch}"
            mkdir -p "$archive_dir"

            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -buildvcs=false -trimpath \
              -ldflags="-s -w -X main.Version=${version} -X main.Commit=${commit} -X main.BuildDate=${build_date}" \
              -o "$archive_dir/cli-proxy-api" ./cmd/server/

            if readelf -l "$archive_dir/cli-proxy-api" | grep -q 'Requesting program interpreter'; then
              readelf -l "$archive_dir/cli-proxy-api" >&2
              echo "no-plugin Linux binary must not require a dynamic interpreter" >&2
              exit 1
            fi

            cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
            tar -C "$archive_dir" -czf "dist/$archive_name" \
              cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
          done

          cd dist
          sha256sum CLIProxyAPI_*.tar.gz | sort -k2 > checksums.txt
          sha256sum -c checksums.txt
      - name: Create immutable release with verified assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_notes_file="$(mktemp)"
          generated_notes_file="$(mktemp)"
          changelog_entries_file="$(mktemp)"
          trap 'rm -f "$release_notes_file" "$generated_notes_file" "$changelog_entries_file"' EXIT

          git fetch --force --tags
          previous_tag=""
          if previous_tag_value="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null)"; then
            previous_tag="$previous_tag_value"
            changelog_range="${previous_tag}..${GITHUB_REF_NAME}"
          else
            changelog_range="$GITHUB_REF_NAME"
          fi

          git log --reverse --pretty=format:'- %s (%h)' "$changelog_range" |
            grep -Ev '^- (docs:|test:)' |
            head -n 200 > "$changelog_entries_file" || true

          if gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > "$generated_notes_file" &&
            [[ -s "$generated_notes_file" ]]; then
            python3 - "$generated_notes_file" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          body = path.read_text(encoding="utf-8")
          limit = 60_000
          if len(body) > limit:
              body = body[:limit].rstrip() + "\n\n_Release notes truncated; use the tag comparison for the complete history._\n"
              path.write_text(body, encoding="utf-8")
          PY
          else
            if [[ -n "$previous_tag" ]]; then
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GH_REPO" "$previous_tag" "$GITHUB_REF_NAME" > "$generated_notes_file"
            else
              printf '**Full Changelog**: https://github.com/%s/commits/%s\n' \
                "$GH_REPO" "$GITHUB_REF_NAME" > "$generated_notes_file"
            fi
          fi

          {
            cat <<'EOF'
          ## Hardened Linux release assets

          - `CLIProxyAPI_<version>_linux_<arch>_no-plugin.tar.gz` is the portable static Linux build.
          - Plugin capabilities are additionally disabled by the maintained fail-closed server policy; the build suffix alone is not the security boundary.
          - `checksums.txt` contains SHA-256 checksums for every archive in this immutable Release.

          EOF
            if [[ -s "$changelog_entries_file" ]]; then
              printf '## Changelog\n\n'
              cat "$changelog_entries_file"
              printf '\n\n'
            fi
            cat "$generated_notes_file"
          } > "$release_notes_file"

          assets=(dist/CLIProxyAPI_*.tar.gz dist/checksums.txt)
          [[ ${#assets[@]} -eq 3 ]]
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$release_notes_file" \
            --verify-tag
